<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One Important Question 💖</title>

  <style>
    body {
      background-color: #ffe6f0;
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 100px;
      overflow: hidden;
    }

    h1 {
      color: #cc0066;
      padding: 0 20px;
    }

    p {
      font-size: 18px;
    }

    button {
      padding: 15px 25px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      position: absolute;
    }

    #yes {
      background-color: #ff4d88;
      color: white;
      left: 30%;
      top: 350px;
    }

    #no {
      background-color: #999;
      color: white;
      left: 55%;
      top: 350px;
    }
  </style>
</head>

<body>

  <h1>Mario, will you be my boyfriend? ❤️</h1>
  <p>You make my life brighter every day.</p>

  <button id="yes" onclick="yesClicked()">YES 💖</button>
  <button id="no" ontouchstart="moveButton()">NO 😅</button>

  <script>
    function moveButton() {
      const noBtn = document.getElementById("no");
      const x = Math.random() * (window.innerWidth - 100);
      const y = Math.random() * (window.innerHeight - 100);
      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    }

    function yesClicked() {
      document.body.innerHTML = `
        <h1>YAY!!! 💕🥹</h1>
        <p>I knew it. I really wanted this with you.</p>
        <p>❤️</p>
      `;
    }
  </script>

</body>
</html>
